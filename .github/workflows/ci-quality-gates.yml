name: CI Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The libraries and Transformations.Tests target net8.0, net9.0 and net10.0; each test run needs its runtime.
      - name: Setup .NET 8, 9 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Transformations.sln

      - name: Build
        run: dotnet build Transformations.sln --configuration Release --no-restore

      - name: Test with coverage (net8.0, net9.0, net10.0)
        run: dotnet test Transformations.Tests/Transformations.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Verify coverage thresholds
        shell: pwsh
        run: |
          $report = Get-ChildItem -Path . -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1
          if (-not $report) { throw "No cobertura report found." }
          ./tools/verify-coverage-thresholds.ps1 -CoverageReportPath $report.FullName -LineThreshold 65 -BranchThreshold 55

      - name: Verify critical public methods have tests
        shell: pwsh
        run: ./tools/verify-public-method-tests.ps1

      - name: Fail on vulnerable packages (direct and transitive)
        shell: pwsh
        run: |
          $out = dotnet list Transformations.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $out
          if ($out -match 'has the following vulnerable packages') { throw "Vulnerable packages found." }

      - name: Pack
        run: dotnet pack Transformations.sln --configuration Release --no-build --output artifacts/packages

      - name: Publish XML docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmldocs
          path: |
            **/bin/Release/net10.0/*.xml

  # Text extraction on Windows: the OCR package's native Tesseract binaries only load there, and file-path,
  # encoding and line-ending behaviour differ from Linux.
  text-extraction-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8, 9 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Test text extraction and safety corpus
        run: dotnet test Transformations.Tests/Transformations.Tests.csproj --configuration Release --filter "FullyQualifiedName~TextExtractor|FullyQualifiedName~CsvDataProfiler|FullyQualifiedName~JsonSchema"
